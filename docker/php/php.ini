; Production overrides for the container image.
;
; Render's free instance has 512 MB of RAM, so 2 GB here meant an OOM kill
; instead of a clean PHP error. 512M is the ceiling PHP should respect; the
; process itself stays well below it.
memory_limit = 512M

; Errors must be visible in the platform log, never in an HTTP response.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Long enough for a scrape/queue job, short enough to release a worker.
max_execution_time = 300
max_input_time = 120
upload_max_filesize = 20M
post_max_size = 25M

; Opcache is the single biggest win for a PHP app served by Apache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

date.timezone = UTC

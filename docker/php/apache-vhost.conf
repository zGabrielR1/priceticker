# Apache virtual host for the container.
#
# The stock Debian vhost points at /var/www/html with AllowOverride None, so
# Laravel's public/.htaccess is ignored and every route except "/" returns
# 404. Serving /app/public directly with AllowOverride All is what makes
# pretty URLs, the health check and Filament work.
<VirtualHost *:8080>
    ServerName priceticker.onrender.com
    ServerAdmin admin@priceticker.local
    DocumentRoot /app/public

    <Directory /app/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php

    # Render captures the container's stdout/stderr; do not hide request logs
    # on a filesystem that disappears on the next deploy.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Never serve dotfiles such as .env or .git.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:apache2]
command=apachectl -D "FOREGROUND" -k start
directory=/app
redirect_stderr=true
autostart=true
autorestart=true
priority=10

[program:cron]
command=/start-cron.sh
directory=/app
stdout_logfile=/var/log/cron.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/cron.log
stderr_logfile_maxbytes=0
user=root
autostart=true
autorestart=true
startsecs=2
priority=20

[program:queue-worker]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:apache2]
; Remove stale PID files before starting Apache after an unclean shutdown.
command=/usr/local/bin/apache2-foreground
directory=/app
redirect_stderr=true
autostart=true
autorestart=true
priority=10

# schedule:work inherits Render's environment in every child process.
# Debian cron drops injected variables; cached config does not cover env() calls.
[program:scheduler]
command=/usr/local/bin/php artisan schedule:work --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=65
priority=20
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

# A loopback-only browser API shares the single free instance. The built-in
# PHP server serializes requests so only one Chromium process runs at a time.
[program:browser-scraper]
command=/usr/local/bin/php -S 127.0.0.1:3000 /app/docker/php/browser-router.php
directory=/app
user=www-data
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
priority=25
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:queue-worker]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

# fly.toml — one machine, one volume, one process.
#
# Stamp it:  python -m foundry.deploy fly --set SERVICE=priceticker \
#                --health /up --port 8080 --out .
#
# Fly runs the Dockerfile in the repository. The [mounts] section is what makes
# Fly the right host for a service that keeps state on disk: unlike Render's
# free plan, a Fly volume survives a restart and a redeploy.
app = 'priceticker'
primary_region = 'gru'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  DATA_DIR = '/data'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # scale to zero when idle; the volume stays, so the ledger is still there
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/up'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

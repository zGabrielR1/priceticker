name: Production uptime

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check application and login page
        env:
          BASE_URL: https://priceticker.onrender.com
        run: |
          # Allow a cold start; fail the run if either endpoint stays unhealthy.
          for path in /up /admin/login; do
            curl --fail --silent --show-error --output /dev/null \
              --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 5 --retry-max-time 100 \
              "${BASE_URL}${path}"
          done

name: Verify retailer discovery sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public retailer catalogs
        run: python3 scripts/probe_discovery_sources.py --out source-probe
      - name: Save verification evidence and verified configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retailer-source-verification
          path: source-probe/
          if-no-files-found: error
          retention-days: 7
